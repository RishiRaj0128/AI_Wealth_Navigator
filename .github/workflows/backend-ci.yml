name: Backend CI

on:
  push:
    branches: [main, Rishi]
  pull_request:
    branches: [main, Rishi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Build & Verify (Python 3.11 + Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moneyops_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Pytest test suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/moneyops_v2
          GEMINI_API_KEY: fake_test_key_for_ci_pipeline
          PYTHONPATH: .
        run: |
          pytest --junitxml=pytest-report.xml

      - name: Upload Pytest Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          retention-days: 7