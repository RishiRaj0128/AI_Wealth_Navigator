name: Dependency & Supply Chain Security

on:
  push:
    branches: [main, Rishi]
  pull_request:
    branches: [main, Rishi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Backend Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit against backend requirements
        working-directory: ./backend
        run: pip-audit -r requirements.txt

  npm-audit:
    name: Frontend Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  osv-scanner:
    name: Cross-Ecosystem Advisory Scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Google OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            -r
            --skip-git
            .
