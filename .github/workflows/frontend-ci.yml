name: Frontend CI

on:
  push:
    branches: [main, Rishi]
  pull_request:
    branches: [main, Rishi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build & Test (Node.js + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify code style & linting
        working-directory: ./frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Validate build output
        run: |
          test -f frontend/dist/index.html || { echo "Missing frontend/dist/index.html"; exit 1; }
          echo "Production frontend build verified successfully."

      - name: Upload frontend distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
