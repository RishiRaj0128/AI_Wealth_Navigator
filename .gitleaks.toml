# Gitleaks Configuration for Insurance Insight Nexus
[extend]
useDefault = true

[allowlist]
description = "Global allowlist for placeholder and mock test tokens"
paths = [
  '''(?i)backend/tests/.*''',
  '''(?i).*\.env\.example''',
  '''(?i)README\.md''',
]
regexes = [
  '''fake_gemini_api_key_placeholder''',
  '''fake_rzp_key_placeholder''',
  '''fake_rzp_secret_placeholder''',
  '''fake_rzp_webhook_placeholder''',
  '''fake_test_key_for_ci_pipeline''',
  '''sk-ant-api03-[A-Za-z0-9_-]{10}placeholder''',
  '''mock-[A-Za-z0-9_-]{16}''',
]