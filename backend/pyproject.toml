[project]
name = "wealth-navigator-backend"
version = "2.0.0"
description = "Wealth Navigator AI Backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "F401",  # unused imports
    "F841",  # unused local variables
    "F541",  # f-string without placeholders
    "E741",  # single letter variable names
]