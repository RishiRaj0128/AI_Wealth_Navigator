[project]
name = "wealth-navigator-backend"
version = "2.0.0"
description = "Wealth Navigator AI Backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # line too long
    "F401",  # unused imports in tests/legacy modules
]